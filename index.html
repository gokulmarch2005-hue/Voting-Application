<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(to right, blue, purple);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: linear-gradient(to right, #4facfe, #00f2fe);
      padding: 40px;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      text-align: center;

      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .logo {
      width: 90px;
      margin-bottom: 15px;

      opacity: 0;
      transform: scale(0.5);
      animation: logoBounce 1s ease forwards;
    }

    @keyframes logoBounce {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }

      50% {
        transform: scale(1.2);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    h2 {
      margin-bottom: 25px;
      color: white;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    input:focus{
      box-shadow:0 0 8px rgba(255,255,255,0.8);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: linear-gradient(135deg,#f953c6,#b91d73);
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.03);
      background: linear-gradient(135deg,#ff4b92,#8e1455);
    }

    .link {
      margin-top: 15px;
      display: block;
      font-size: 14px;
      color: white;
      cursor: pointer;
    }

    .link:hover{
      text-decoration: underline;
    }

  </style>
</head>

<body>

  <div class="login-box">

    <!-- Logo -->
    <img src="letter_p remove.png" class="logo" alt="Logo">

    <h2>Login</h2>

    <form>

      <input type="text" placeholder="Mobile number" id="username">

      <input type="password" placeholder="Pin number" id="password">

      <button type="button" onclick="login()">
        Login
      </button>

    </form>

    <span class="link">
      Don't have an account? Sign up
    </span>

  </div>

  <script>

    function login() {

      let user = document.getElementById("username").value;
      let pass = document.getElementById("password").value;

      if(user === "" || pass === "") {
        alert("Please fill all fields");
        return;
      }

      // Demo login
      if(user === "loop" && pass === "4321") {

        alert("Login Successful");

        window.location.href = "home.html";

      } else {

        alert("Invalid login");

      }
    }

  </script>

</body>
</html>
