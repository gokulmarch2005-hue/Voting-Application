<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>

  <style>

    body{
      font-family:Arial;
      background:#f4f7fc;
      padding:40px;
    }

    h1{
      text-align:center;
      margin-bottom:30px;
    }

    .dashboard{
      display:flex;
      justify-content:center;
      gap:30px;
      flex-wrap:wrap;
    }

    .card{
      width:250px;
      background:white;
      padding:30px;
      border-radius:15px;
      text-align:center;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .card h2{
      color:#4facfe;
      font-size:40px;
    }

  </style>
</head>

<body>

  <h1>Admin Dashboard</h1>

  <div class="dashboard">

    <div class="card">
      <h2>120</h2>
      <p>Total Users</p>
    </div>

    <div class="card">
      <h2>85</h2>
      <p>Total Votes</p>
    </div>

    <div class="card">
      <h2>2</h2>
      <p>Candidates</p>
    </div>

  </div>

</body>
</html>
