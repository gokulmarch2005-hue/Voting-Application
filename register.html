<!DOCTYPE html>
<html>
<head>
  <title>Register</title>

  <style>

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:linear-gradient(to right,#00c6ff,#0072ff);
      font-family:Arial;
    }

    .register-box{
      background:white;
      padding:40px;
      width:350px;
      border-radius:15px;
      text-align:center;
    }

    input{
      width:100%;
      padding:12px;
      margin:10px 0;
      border:1px solid #ccc;
      border-radius:8px;
    }

    button{
      width:100%;
      padding:12px;
      background:#0072ff;
      color:white;
      border:none;
      border-radius:8px;
      cursor:pointer;
    }

  </style>
</head>

<body>

  <div class="register-box">

    <h2>Create Account</h2>

    <input type="text" placeholder="Full Name">

    <input type="email" placeholder="Email">

    <input type="password" placeholder="Password">

    <button onclick="register()">
      Register
    </button>

  </div>

  <script>

    function register(){

      alert("Registration Successful");

      window.location.href = "index.html";

    }

  </script>

</body>
</html>
